name: CI

# One gated pipeline for the code: tests → wheel build + smoke → publish. Publishing is chained on
# the full test suite via `needs:`, so a red test can never ship a wheel. Docs deploy lives in its own
# workflow (docs.yml) — a genuinely independent concern (Pages, path-filtered).
#
# Publishing is trunk-based and tag-free (the prompticorn pattern): PR to main → TestPyPI preview,
# push to main → PyPI release, versions DERIVED (no tags), via PyPI trusted publishing (OIDC, no token).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Advisories land against dependencies that never changed, so a push-only pipeline can sit
  # green for months while a crate in Cargo.lock goes vulnerable underneath it. The weekly run
  # is what makes `engine-audit` a monitor rather than a snapshot. It also re-runs the suite
  # against a freshly-resolved `stable` toolchain, catching rustc drift before a PR eats it.
  # The wheel/publish path is skipped on this trigger — see the `build` job's `if:`.
  schedule:
    - cron: "0 7 * * 1"   # Mondays 07:00 UTC
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PACKAGE_NAME: tiderace
  MAJOR_VERSION: "0"   # bump for a breaking release; MINOR/PATCH are derived

permissions:
  contents: read

jobs:
  engine-linux:
    name: engine · linux · build · lint · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        # Pinned to a commit SHA, so the ref name no longer selects the toolchain — the `stable`
        # BRANCH defaults `toolchain` to stable, but the `v1` tag makes it required with no default
        # and hard-exits when empty. Every call site therefore passes `toolchain` explicitly.
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: ${{ runner.os }}-engine-cargo-${{ hashFiles('engine/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Provision the fx venv (numpy + pytest) at the repo root
        # Previously skipped here, which meant this job ran the *entire* live suite as no-ops: the
        # fork/no-fork/sub-interpreter acceptances resolve <repo>/.tiderace-fx-venv by path and, absent
        # it, early-returned — which the Rust harness reports as `ok`. The job was green on the
        # engine's load-bearing invariants (no-fork ≡ fork, sub-interp ≡ fork) without executing one
        # of them. Provisioning costs ~15s and makes the green mean something.
        working-directory: .
        run: |
          python -m venv .tiderace-fx-venv
          .tiderace-fx-venv/bin/pip install --upgrade pip
          .tiderace-fx-venv/bin/pip install numpy pytest

      - name: Unit + lib + daemon + live acceptance tests
        # TIDERACE_REQUIRE_LIVE=1 turns a live-scenario skip into a failure (engine_core::testing).
        # This job provisions the interpreter above, so a skip here means the environment broke — and
        # that must fail loudly rather than pass as a silent no-op.
        #
        # PYTHONPATH puts the in-tree `tiderace` package on the interpreters the workers spawn (TID-21).
        # The shim's `_register_builtins` is best-effort — `import tiderace.builtins` failing means NO
        # builtin is registered — so without this every builtin (monkeypatch/tmp_path/capsys/capfd/
        # caplog) was silently absent and completely uncovered, while the suite stayed green because
        # nothing asked for one. Paired with REQUIRE_LIVE above, `builtins_acceptance` now fails the
        # job if that ever regresses instead of skipping past it.
        env:
          TIDERACE_REQUIRE_LIVE: "1"
          PYTHONPATH: ${{ github.workspace }}/engine/py-tiderace
        run: cargo test --all

      - name: Type-check the excluded engine-inproc crate
        # `engine-inproc` (the PyO3 ② side-bet) is excluded from the workspace, so `--workspace` never
        # touches it, and it has no tests of its own. It silently bit-rotted: TID-1 added
        # `ExecResponse.pure` and this crate stopped compiling — unnoticed, because nothing built it.
        #
        # `cargo check` catches that in seconds and does NOT link, so it needs no libpython dev package
        # (which is what makes a full build here awkward). Keep it a check, not a build.
        working-directory: engine/crates/engine-inproc
        run: cargo check --all-targets

      - name: Release build
        run: cargo build --release

  engine-windows:
    # ADR-E008 capability matrix: validate the pure-Rust engine compiles and its unit/lib + daemon
    # logic passes on Windows, which has no fork(). The fork-based live integration tests self-skip
    # without the fx venv; the **no-fork SubprocessWorker acceptance** (nofork_acceptance.rs) DOES run
    # here — it drives the `--no-fork` shim against the interpreter provisioned below, exercising the
    # no-COW fallback on the platform it exists for (TID-5 / ROADMAP-v2 Phase-7).
    name: engine · windows · build · lint · unit
    runs-on: windows-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: ${{ runner.os }}-engine-cargo-${{ hashFiles('engine/Cargo.lock') }}
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: Set up Python
        # Provides `python` on PATH so the no-fork acceptance runs on Windows (no fork() here).
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Unit + lib + daemon tests (no-fork acceptance runs; fork integration self-skips)
        run: cargo test --all
      - name: Release build
        run: cargo build --release

  engine-coverage:
    name: engine · coverage (line >= 88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        # Same ref-name caveat as rust-toolchain: the `cargo-llvm-cov` branch defaults `tool` to
        # cargo-llvm-cov, but the v2 tag does not. Pinned to v2, so name the tool explicitly.
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-llvm-cov
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Provision the fx venv (numpy + pytest) at the repo root
        # The fork-based acceptance + daemon e2e tests resolve <repo>/.tiderace-fx-venv by path (no env
        # needed). Without it they self-skip and the exec/fork + daemon paths go uncovered, so the gate
        # would only measure the pure-logic core. fx_corpus imports numpy + pytest.
        run: |
          python -m venv .tiderace-fx-venv
          .tiderace-fx-venv/bin/pip install --upgrade pip
          .tiderace-fx-venv/bin/pip install numpy pytest
      - name: Coverage gate (engine workspace, line >= 88)
        working-directory: engine
        # Exclude binary glue with no logic from the denominator: main.rs (CLI entry / arg dispatch) and
        # socket.rs (the Unix-socket serve loop — a killed-process path that can't flush its profile,
        # the analogue of the previous watcher.rs exclusion). Everything else — including the exec/fork +
        # daemon live paths, covered because the venv is provisioned above — is measured. Local baseline
        # ~91% lines; the gate sits at 88 for headroom.
        # TIDERACE_REQUIRE_LIVE=1: the venv is provisioned above, so a silent live-skip here would
        # quietly drop the exec/fork + daemon paths out of the measured set and shrink the gate to the
        # pure-logic core. Fail instead.
        # PYTHONPATH: same reason as the linux job (TID-21) — without the in-tree `tiderace` package
        # the builtin providers never register, so their paths drop out of the measured set too.
        env:
          TIDERACE_REQUIRE_LIVE: "1"
          PYTHONPATH: ${{ github.workspace }}/engine/py-tiderace
        run: cargo llvm-cov --workspace --ignore-filename-regex '(main|socket)\.rs' --fail-under-lines 88

  engine-audit:
    name: engine · cargo audit (RustSec advisories)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Install cargo-audit
        # Prebuilt binary — `cargo install cargo-audit` compiles for minutes; this is seconds.
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-audit
      - name: Audit Cargo.lock against the RustSec advisory DB
        # `--deny warnings` also fails on unmaintained/unsound/yanked crates, not just on CVEs.
        # That is affordable here precisely because the tree is tiny — 50 crates, three direct
        # third-party deps (notify, serde, serde_json) — so the advisory surface barely moves.
        # If an unmaintained advisory ever lands on a transitive crate with no fix available and
        # blocks unrelated PRs, drop to a bare `cargo audit` (CVEs only) or add an `--ignore
        # RUSTSEC-YYYY-NNNN` with a comment justifying it. Do not delete the gate.
        run: cargo audit --deny warnings

  # ── release stage ──────────────────────────────────────────────────────────────────────────────
  # Derive the version ONCE, build one wheel per platform, prove each installs and runs, verify the
  # Linux glibc floor, then publish the merged set. Still the same scripts/build-wheel.sh you run
  # locally. GATED on the full test suite: a red test can't ship.
  #
  # Until 0.2.0 this stage was a single ubuntu-latest job, which shipped exactly one wheel —
  # `py3-none-manylinux_2_39_x86_64`. Two separate defects produced that, and they need separate
  # fixes; both are addressed below.
  #   1. `maturin build` compiles for the HOST triple only, and there was no matrix. Windows, macOS
  #      and aarch64 were never built at all — not unsupported, just never compiled.
  #   2. Building on ubuntu-latest (24.04) binds the newest versioned glibc symbols, so maturin can
  #      only tag manylinux_2_39. glibc is backward- but NOT forward-compatible, so pip correctly
  #      refuses that wheel on Ubuntu 22.04 (2.35), Debian 12 (2.36) and RHEL 9 / AL2023 (2.34) —
  #      every one of them silently fell back to the sdist, which needs a Rust toolchain to build.
  #
  # What makes one-wheel-per-platform sufficient: `bindings = "bin"` with no extension module means
  # nothing links libpython (hence the `py3-none-<platform>` tag), so a single wheel per platform
  # serves every Python 3.12+. There is no ABI axis to multiply the matrix by.

  version:
    name: derive version + sdist
    # engine-audit joins the gate: a known-vulnerable dependency can no longer ship a wheel, on
    # the same principle that already keeps a red test from shipping one.
    needs: [engine-linux, engine-windows, engine-coverage, engine-audit]
    # The weekly cron exists to re-check advisories, not to mint artifacts. Without this guard the
    # scheduled run would derive a release-shaped version (calculate_version.py reads GITHUB_REF =
    # refs/heads/main and returns MAJOR.MINOR.0) and upload a wheel nobody asked for. Everything
    # downstream hangs off this job, so guarding here skips the whole release stage.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_publish_testpypi: ${{ steps.version.outputs.should_publish_testpypi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `maturin sdist` does not compile, but it does shell out to `cargo metadata`.
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install maturin
        run: python -m pip install --upgrade pip maturin

      # Derivation lives in its own job so it happens exactly once and every leg of the matrix
      # below is pinned to the same answer. Running it per-leg would be actively wrong: on the
      # non-main push path calculate_version.py builds the suffix from datetime.now(), so five
      # legs would race to five different versions and publish a mismatched set.
      - name: Derive version (no tags)
        id: version
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: python .github/scripts/calculate_version.py

      - name: Pin the derived version into the package
        run: python scripts/set_version.py "${{ steps.version.outputs.version }}"

      # The sdist is platform-independent, so it is built once here rather than five times.
      - name: Build sdist
        run: maturin sdist -m engine/crates/tiderace-dist/Cargo.toml -o dist

      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tiderace-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build:
    name: wheel · ${{ matrix.name }}
    needs: [version]
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    strategy:
      # One platform failing should not hide the state of the other four — with five legs, a
      # cancelled matrix costs a whole round-trip to learn what a single run could have told us.
      fail-fast: false
      matrix:
        include:
          # The Linux legs build INSIDE the official manylinux images rather than on the runner.
          # That is the fix for defect #2: the toolchain there links against glibc 2.28, so the
          # binary only ever references symbols old enough to load on RHEL 8 and everything newer.
          # 2_28 specifically — it is the oldest glibc that still runs the Node-based GitHub
          # Actions natively (manylinux2014 / glibc 2.17 cannot run actions/checkout).
          #
          # Chosen over PyO3/maturin-action so scripts/build-wheel.sh stays the single canonical
          # build path, and so this adds no new third-party action to the supply-chain surface
          # that was just pinned down. Images are digest-pinned on the same principle.
          - name: linux-x86_64
            runs-on: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64@sha256:f854c50adf7b7a325bc4794316f3758d387a41d61f9e2ebca0f26c7dc8f761d4
            macos-target: ""
            rust-targets: ""
            maturin-target: ""
          - name: linux-aarch64
            runs-on: ubuntu-24.04-arm   # native arm runner — free for public repos, no QEMU
            container: quay.io/pypa/manylinux_2_28_aarch64@sha256:b9dd5b2d6885fae144119ac934978003bcc413087ea08f602a960257205ec246
            macos-target: ""
            rust-targets: ""
            maturin-target: ""
          # ONE universal2 wheel rather than separate arm64 and x86_64 legs. The Intel runner
          # (macos-13) sat queued 39 minutes on the first run of this matrix — Intel macOS capacity
          # is scarce and shrinking, and making every release wait on it is not a dependency worth
          # taking. maturin lipos both slices here instead, on a runner that is always available.
          #
          # It also keeps the smoke test honest: a wheel cross-built for x86_64 could not be
          # installed on an arm64 runner at all (pip would reject the tag), so a separate cross leg
          # would have had to ship untested. universal2 installs natively here and gets exercised.
          #
          # MACOSX_DEPLOYMENT_TARGET sets the floor in the platform tag. Left unset, the runner
          # stamps its own OS version and we repeat the glibc mistake on macOS. 11.0 is the first
          # Apple Silicon release, so it is the floor for a universal2 wheel.
          - name: macos-universal2
            runs-on: macos-14
            container: ""
            macos-target: "11.0"
            rust-targets: "x86_64-apple-darwin aarch64-apple-darwin"
            maturin-target: universal2-apple-darwin
          - name: windows-x86_64
            runs-on: windows-latest
            container: ""
            macos-target: ""
            rust-targets: ""
            maturin-target: ""
    defaults:
      run:
        # build-wheel.sh is bash; on Windows this resolves to Git Bash. Setting it at job level
        # keeps one set of step bodies instead of a POSIX and a PowerShell variant of each.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The manylinux images ship the CPython builds but no rustup, and setup-python cannot install
      # into them — so the container legs provision by hand and put the image's cp312 on PATH.
      # requires-python is >=3.12, so cp312 is the floor interpreter.
      - name: Provision toolchain (manylinux container)
        if: matrix.container != ''
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        if: matrix.container == ''
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Set up Python
        if: matrix.container == ''
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          # Keyed on matrix.name, not runner.os: the two Linux legs are different architectures and
          # must not share a target dir, and neither may share with the non-container engine jobs.
          key: ${{ matrix.name }}-wheel-cargo-${{ hashFiles('engine/Cargo.lock') }}

      - name: Install maturin + uv
        run: python -m pip install --upgrade pip maturin uv

      - name: Pin the derived version into the package
        run: python scripts/set_version.py "${{ needs.version.outputs.version }}"

      - name: Add cross-compilation targets
        if: matrix.rust-targets != ''
        run: rustup target add ${{ matrix.rust-targets }}

      # Canonical build path — identical to local. Stages the shim, then maturin.
      - name: Build wheel
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos-target }}
          MATURIN_TARGET: ${{ matrix.maturin-target }}
        run: |
          if [ -n "$MATURIN_TARGET" ]; then
            scripts/build-wheel.sh --release --target "$MATURIN_TARGET" -o dist
          else
            scripts/build-wheel.sh --release -o dist
          fi

      # The guarantee: a fresh install must run a suite with NO env vars — the bundled shim is found
      # and executed. Previously inline bash that hardcoded POSIX venv layout and an extensionless
      # binary name; now a script, because it has to pass on Windows and macOS too.
      - name: Smoke test — install the wheel and run a corpus zero-config
        run: python scripts/smoke_wheel.py --dist dist

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # upload-artifact requires unique names per job; the publish jobs glob them back
          # together with merge-multiple.
          name: tiderace-wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  verify-glibc-floor:
    # The regression guard for defect #2, which no existing job could have caught: the smoke test
    # above installs each wheel on the same machine that built it, so glibc matches by construction
    # and the check stays green while the wheel is uninstallable everywhere else.
    #
    # glibc 2.34 (AlmaLinux 9 — i.e. RHEL 9, Rocky 9, Amazon Linux 2023) sits deliberately between
    # the 2.28 build floor and the 2.39 the broken wheels were tagged with. The 0.1.0 and 0.2.0
    # wheels could NOT install here. If this job passes, the floor genuinely moved.
    name: verify glibc floor · install on glibc 2.34
    needs: [build]
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_34_x86_64@sha256:249cdcdcd91ba0639b50140a5a4cd09eead2056e2f76267e7919678a66f9d33d
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tiderace-wheel-linux-x86_64
          path: dist/
      - name: Put the image's cp312 on PATH
        run: echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Install and run the wheel on an older glibc than it was built on
        run: python scripts/smoke_wheel.py --dist dist

  publish-testpypi:
    name: publish preview to TestPyPI (PRs to main)
    needs: [version, build, verify-glibc-floor]
    if: vars.PYPI_PUBLISH == 'true' && github.event_name == 'pull_request' && github.event.action != 'closed' && needs.version.outputs.should_publish_testpypi == 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/tiderace
    permissions:
      id-token: write   # trusted publishing — no token
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # Five wheels + the sdist, uploaded by six different jobs, flattened into one dist/.
          pattern: tiderace-*
          path: dist/
          merge-multiple: true
      - name: List what is about to be published
        run: ls -l dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: publish release to PyPI (push to main)
    needs: [version, build, verify-glibc-floor]
    if: vars.PYPI_PUBLISH == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tiderace
    permissions:
      id-token: write   # trusted publishing — no token
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tiderace-*
          path: dist/
          merge-multiple: true
      - name: List what is about to be published
        run: ls -l dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
