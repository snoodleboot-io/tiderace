version: '1.0'
repository:
  type: single-language
  mappings: {}
spec:
  language: rust
  runtime: '1.76'
  package_manager: Cargo
  test_framework: built-in
  linter:
    - clippy
  linters:
    - clippy
  formatter: rustfmt
  abstract_class_style: interface
  coverage:
    line: 80
    branch: 70
    function: 90
    statement: 85
    mutation: 80
    path: 60
  repo_type: single-language
  layout_style: src
  error_handling: Not specified
project:
  commit_style: ''
  pr_size: ''
  deploy_target: ''
variant: verbose
active_personas:
  - backend_software_engineer
  - frontend_software_engineer
  - fullstack_software_engineer
  - software_engineer
  - architect
  - qa_tester
  - devops_engineer
  - security_engineer
  - product_manager
  - technical_writer
