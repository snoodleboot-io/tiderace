[package]
name = "engine-cli"
description = "Pure-Rust Python test engine — thin CLI front-end over engine-core."
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "tiderace"
path = "src/main.rs"

[dependencies]
engine-core = { path = "../engine-core" }
# The daemon client (TID-84): `tiderace run` hands a run to a live daemon, `tiderace daemon` manages one.
engine-daemon = { path = "../engine-daemon" }

[dev-dependencies]
# Only the integration tests read the `--report` file back.
serde_json = { workspace = true }
