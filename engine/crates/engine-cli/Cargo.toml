[package]
name = "engine-cli"
description = "Pure-Rust Python test engine — thin CLI front-end over engine-core."
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "tiderace"
path = "src/main.rs"

[dependencies]
engine-core = { path = "../engine-core" }

[dev-dependencies]
# Only the integration test reads the `--report` file back; the binary itself still has no
# dependency beyond `engine-core`.
serde_json = { workspace = true }
